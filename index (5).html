<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hùng Vương – Quản lý văn bản</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HV Văn bản">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#1e3a8a; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#f1f5f9;
         padding-top:env(safe-area-inset-top,0px); box-sizing:border-box; }
  #splash { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#fff;
            font:600 15px system-ui,sans-serif; background:#1e3a8a; transition:opacity .4s; }
  #splash img { width:96px; height:96px; border-radius:22px; }
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><div>Hùng Vương · Đang mở…</div></div>
<!-- ▼▼ THAY bằng địa chỉ Web App của anh/chị (Triển khai → Quản lý triển khai → URL ứng dụng web, dạng …/exec) ▼▼ -->
<iframe id="app" name="pwa" title="Hùng Vương" allow="camera; clipboard-write; fullscreen"
        src="https://script.google.com/macros/s/AKfycbyoQUNAFGaB2-j04BKjKiRHI7sA7iOX6TzGWxcAp0CBarVIUqgbXMGL18ig86X0OjiYng/exec"></iframe>
<script>
  document.getElementById('app').addEventListener('load', function () {
    var s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(function () { s.remove(); }, 450);
  });
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
